<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qi Chat</title>
<meta name="theme-color" content="#f26b1d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --o:#f26b1d; --o2:#fff3eb; --ink:#1d1d1f; --mute:#6b6b70; --line:#ececef; --bg:#ffffff; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display:flex; flex-direction:column; height:100dvh; }
  header { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); }
  header .logo { width:30px; height:30px; border-radius:9px; background:var(--o); color:#fff; display:grid; place-items:center; font-weight:700; }
  header h1 { font-size:17px; margin:0; flex:1; white-space:nowrap; }
  header select { max-width:46vw; font:inherit; font-size:14px; padding:6px 8px; border:1px solid var(--line); border-radius:10px; background:#fff; }
  .btn { border:0; background:none; font:inherit; color:var(--o); font-weight:600; padding:6px 8px; border-radius:8px; cursor:pointer; }
  .btn:hover { background:var(--o2); }
  #log { flex:1; overflow-y:auto; padding:16px 14px 8px; }
  .msg { max-width:760px; margin:0 auto 12px; display:flex; }
  .msg.user { justify-content:flex-end; }
  .bubble { padding:10px 14px; border-radius:16px; white-space:pre-wrap; word-wrap:break-word; max-width:88%; }
  .user .bubble { background:var(--o); color:#fff; border-bottom-right-radius:5px; }
  .qi .bubble { background:var(--o2); border-bottom-left-radius:5px; }
  .note { text-align:center; color:var(--mute); font-size:14px; margin:24px auto; max-width:520px; }
  form { display:flex; gap:8px; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); max-width:790px; width:100%; margin:0 auto; }
  textarea { flex:1; resize:none; font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:14px; max-height:140px; outline:none; }
  textarea:focus { border-color:var(--o); }
  form button { background:var(--o); color:#fff; border:0; border-radius:14px; padding:0 18px; font:inherit; font-weight:600; cursor:pointer; }
  form button:disabled { opacity:.5; }
  dialog { border:0; border-radius:16px; padding:20px; width:min(440px, 92vw); }
  dialog::backdrop { background:rgba(0,0,0,.3); }
  dialog label { display:block; font-size:14px; color:var(--mute); margin:10px 0 4px; }
  dialog input { width:100%; font:inherit; padding:9px 10px; border:1px solid var(--line); border-radius:10px; }
  .row { display:flex; justify-content:space-between; gap:8px; margin-top:16px; }
  .status { font-size:12px; color:var(--mute); }
  .bubble pre { background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px; overflow-x:auto; white-space:pre; }
  .bubble code { font-family:ui-monospace, Menlo, Consolas, monospace; font-size:14px; }
  .bubble a { color:#b8470c; word-break:break-all; }
  #bar { font-size:12px; color:var(--mute); padding:4px 14px; border-bottom:1px solid var(--line); text-align:center; min-height:24px; }
  #bar b { color:var(--ink); font-weight:600; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#bbb; margin-right:5px; vertical-align:middle; }
  .dot.on { background:#1f9d55; }
  .switch { text-align:center; color:var(--mute); font-size:12px; margin:6px auto 14px; }
  dialog p { color:var(--mute); font-size:14px; margin:6px 0 0; }
</style>
</head>
<body>
<header>
  <div class="logo">Qi</div>
  <h1>Qi Chat</h1>
  <select id="server" aria-label="Choose a Qi model"></select>
  <button class="btn" id="newChat" title="New chat">New</button>
  <button class="btn" id="menuBtn" title="Settings">⋯</button>
</header>
<div id="bar">Looking for Qi models…</div>
<div id="log"></div>
<form id="form">
  <textarea id="input" rows="1" placeholder="Message Qi…" autocomplete="off"></textarea>
  <button id="send">Send</button>
</form>


<dialog id="menuDlg">
  <h3 style="margin:0">Settings</h3>
  <div class="row" style="flex-direction:column;align-items:flex-start">
    <button class="btn" id="mRefresh">Check models again</button>
    <button class="btn" id="mAdd">Add a Qi server by hand</button>
    <button class="btn" id="mClose">Close</button>
  </div>
</dialog>

<dialog id="dlg">
  <h3 style="margin:0">Add a Qi server</h3>
  <label for="dName">Name</label><input id="dName" placeholder="Qi Test">
  <label for="dUrl">Server address (or paste the whole Qi link here)</label><input id="dUrl" placeholder="https://….trycloudflare.com">
  <label for="dKey">Key</label><input id="dKey" placeholder="qi-…">
  <div class="row">
    <button class="btn" id="dDel" style="color:#b3261e">Remove this one</button>
    <span><button class="btn" id="dCancel">Cancel</button> <button class="btn" id="dSave">Save</button></span>
  </div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
// The Qi models of Q-CUBIC. Each running server posts its current address to an open notice board; the newest note wins.
const BOARD = 'https://ntfy.sh/qcubic-qi-models-f207696921/json?poll=1&since=13h';
const MODELS = [
  { slug: 'qi-ultra',  name: 'Qi Ultra',     where: 'Kaggle' },
  { slug: 'qi-pro',    name: 'Qi Pro',       where: 'Google Colab' },
  { slug: 'qi-oracle', name: 'Qi Always On', where: 'Oracle Cloud' },
];
let models = MODELS.map(m => ({ ...m, url: '', key: '', online: false, stats: null }));
let manual = store.get('qi.servers', []);          // servers added by hand or from an old link
let currentName = store.get('qi.currentName', '');
let chat = store.get('qi.chat', { id: crypto.randomUUID(), messages: [] });
let busy = false;

(function fromLink() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (!h.get('s')) return;
  const s = { name: h.get('n') || 'Qi', url: h.get('s').replace(/\/+$/, ''), key: h.get('k') || '' };
  const i = manual.findIndex(x => x.name === s.name);
  if (i >= 0) manual[i] = s; else manual.push(s);
  currentName = s.name; store.set('qi.servers', manual); store.set('qi.currentName', currentName);
  history.replaceState(null, '', location.pathname);
})();

function all() {
  // A registered model wins over an old hand-added entry with the same name while it is online.
  const list = models.map(m => ({ ...m, auto: true }));
  for (const s of manual) {
    const i = list.findIndex(x => x.name === s.name);
    if (i >= 0 && !list[i].online) list[i] = { ...list[i], url: s.url, key: s.key, online: !!s.online, stats: s.stats };
    else if (i < 0) list.push({ ...s, where: 'added by hand' });
  }
  return list;
}
let picked = false;   // true once the person chooses a model in this visit
function current() {
  const l = all(), want = l.find(x => x.name === currentName);
  if (want && (want.online || picked)) return want;
  return l.find(x => x.online) || want || l[0];
}

function timeout(ms) { const a = new AbortController(); setTimeout(() => a.abort(), ms); return a.signal; }
async function check(s) {
  if (!s.url) return { online: false, stats: null };
  try {
    const h = await fetch(s.url + '/health', { signal: timeout(8000) });
    if (!h.ok) return { online: false, stats: null };
    let stats = null;
    try { const r = await fetch(s.url + '/qi/stats', { headers: { Authorization: 'Bearer ' + s.key }, signal: timeout(8000) }); if (r.ok) stats = await r.json(); } catch {}
    return { online: true, stats };
  } catch { return { online: false, stats: null }; }
}

async function loadModels() {
  try {
    const r = await fetch(BOARD, { cache: 'no-store' });
    const notes = {};
    for (const line of (await r.text()).split('\n')) {
      try {
        const e = JSON.parse(line); if (e.event !== 'message') continue;
        const n = JSON.parse(e.message);
        if (n.slug && n.url && (!notes[n.slug] || e.time >= notes[n.slug].t)) notes[n.slug] = { ...n, t: e.time };
      } catch {}
    }
    for (const m of models) { const n = notes[m.slug]; if (n) { m.url = n.url; m.key = n.key; m.about = n.about; } }
  } catch {}
  await Promise.all([...models, ...manual].map(async s => Object.assign(s, await check(s))));
  fillServers(); showBar();
}

function fillServers() {
  const sel = $('#server'); sel.innerHTML = '';
  for (const s of all()) sel.add(new Option((s.online ? '● ' : '○ ') + s.name + (s.online ? '' : ' (off)'), s.name));
  const c = current(); if (c) sel.value = c.name;
}
function showBar() {
  const c = current(), bar = $('#bar');
  if (!c) { bar.textContent = 'No Qi models yet.'; return; }
  if (!c.online) {
    const on = all().filter(x => x.online).map(x => x.name);
    bar.innerHTML = '<span class="dot"></span><b>' + c.name + '</b> is switched off right now' +
      (on.length ? '. Online: ' + on.join(', ') + '.' : '. No Qi model is on right now; ask your admin to start one.');
    return;
  }
  const st = c.stats, bits = ['<span class="dot on"></span><b>' + c.name + '</b> is online'];
  if (c.where) bits.push('on ' + c.where);
  if (st) { bits.push(st.busy + ' of ' + st.slots + ' answering now'); bits.push(st.chats_today + ' chats today'); }
  bar.innerHTML = bits.join(' · ');
}

function md(t) {
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const blocks = t.split(/```/);
  return blocks.map((b, i) => {
    if (i % 2) return '<pre><code>' + esc(b.replace(/^[a-z0-9]*\n/i, '')) + '</code></pre>';
    let h = esc(b);
    h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>')
         .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
         .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>')
         .replace(/^#{1,6} (.*)$/gm, '<b>$1</b>')
         .replace(/^\s*[-*] (.*)$/gm, '• $1')
         .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
         .replace(/(^|[\s(])(https?:\/\/[^\s)<]*[^\s)<.,;:!?'])/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    return h;
  }).join('');
}
function setMd(el, t) { el.innerHTML = md(t); }

function bubble(role, text) {
  const row = document.createElement('div'); row.className = 'msg ' + (role === 'user' ? 'user' : 'qi');
  const b = document.createElement('div'); b.className = 'bubble';
  if (role === 'user') b.textContent = text; else setMd(b, text);
  row.append(b); $('#log').append(row); $('#log').scrollTop = 1e9; return b;
}
function switchNote(name) { const d = document.createElement('div'); d.className = 'switch'; d.textContent = 'Now talking to ' + name; $('#log').append(d); }
function render() {
  $('#log').innerHTML = '';
  if (!chat.messages.length) $('#log').innerHTML = '<p class="note">Hi! I\'m Qi by Q-CUBIC. Choose a Qi model at the top and ask me anything.</p>';
  for (const m of chat.messages) {
    if (m.role === 'switch') switchNote(m.content); else bubble(m.role, m.content);
  }
}

async function send(text) {
  const s = current();
  if (!s || !s.url) { $('#bar').innerHTML = 'No Qi model is available yet. Tap ⋯ to check again or add one.'; return; }
  chat.messages.push({ role: 'user', content: text });
  if (chat.messages.length === 1) $('#log').innerHTML = '';
  bubble('user', text);
  const out = bubble('assistant', '…');
  busy = true; $('#send').disabled = true;
  let answer = '', status = 'Thinking';
  try {
    const history = chat.messages.filter(m => m.role !== 'switch').slice(-20);
    const r = await fetch(s.url + '/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + s.key },
      body: JSON.stringify({ messages: history, stream: true, qi_chat: chat.id, temperature: 0.7 })
    });
    if (!r.ok) {
      let msg = s.name + ' could not answer (' + r.status + ').';
      try { msg = (await r.json()).error.message || msg; } catch {}
      throw new Error(msg);
    }
    const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = '';
    while (true) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ') || line.includes('[DONE]')) continue;
        try {
          const j = JSON.parse(line.slice(6));
          if (j.qi_status) { status = j.qi_status; continue; }
          if (j.error) throw new Error(j.error.message);
          answer += j.choices[0].delta.content || '';
        } catch (e) { if (e.message && e.message.startsWith('Qi brain')) throw e; }
      }
      if (answer) setMd(out, answer); else out.textContent = status + ' …';
      $('#log').scrollTop = 1e9;
    }
    chat.messages.push({ role: 'assistant', content: answer });
  } catch (e) {
    out.textContent = (e.message || '').includes('Failed to fetch') || e.name === 'TypeError'
      ? s.name + ' is not reachable right now; it may have been switched off. Pick another Qi model at the top.'
      : e.message;
    chat.messages.pop();
    loadModels();
  }
  store.set('qi.chat', chat);
  busy = false; $('#send').disabled = false;
}

$('#form').addEventListener('submit', e => {
  e.preventDefault(); const t = $('#input').value.trim();
  if (!t || busy) return; $('#input').value = ''; autosize(); send(t);
});
$('#input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !matchMedia('(pointer:coarse)').matches) { e.preventDefault(); $('#form').requestSubmit(); }
});
function autosize() { const t = $('#input'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 140) + 'px'; }
$('#input').addEventListener('input', autosize);
$('#newChat').onclick = () => { chat = { id: crypto.randomUUID(), messages: [] }; store.set('qi.chat', chat); render(); };
$('#server').onchange = e => {
  currentName = e.target.value; picked = true; store.set('qi.currentName', currentName); showBar();
  if (chat.messages.length) { chat.messages.push({ role: 'switch', content: currentName }); store.set('qi.chat', chat); switchNote(currentName); $('#log').scrollTop = 1e9; }
};

$('#menuBtn').onclick = () => $('#menuDlg').showModal();
$('#mClose').onclick = () => $('#menuDlg').close();
$('#mRefresh').onclick = () => { $('#menuDlg').close(); $('#bar').textContent = 'Checking Qi models…'; loadModels(); };
$('#mAdd').onclick = () => { $('#menuDlg').close(); openAdd(); };

let editing = -1;
function openAdd() {
  editing = manual.findIndex(x => x.name === currentName);
  const s = manual[editing] || { name: '', url: '', key: '' };
  $('#dName').value = s.name; $('#dUrl').value = s.url; $('#dKey').value = s.key;
  $('#dDel').style.visibility = editing >= 0 ? 'visible' : 'hidden';
  $('#dlg').showModal();
}
$('#dCancel').onclick = e => { e.preventDefault(); $('#dlg').close(); };
$('#dSave').onclick = e => {
  e.preventDefault();
  let s = { name: $('#dName').value.trim() || 'Qi', url: $('#dUrl').value.trim().replace(/\/+$/, ''), key: $('#dKey').value.trim() };
  if (s.url.includes('#s=')) {
    const h = new URLSearchParams(s.url.split('#')[1]);
    s = { name: h.get('n') || s.name, url: (h.get('s') || '').replace(/\/+$/, ''), key: h.get('k') || s.key };
  }
  if (!s.url.startsWith('https://')) { $('#dUrl').setCustomValidity('The address must start with https://'); $('#dUrl').reportValidity(); setTimeout(() => $('#dUrl').setCustomValidity(''), 3000); return; }
  const i = manual.findIndex(x => x.name === s.name);
  if (i >= 0) manual[i] = s; else manual.push(s);
  currentName = s.name; store.set('qi.servers', manual); store.set('qi.currentName', currentName);
  $('#dlg').close(); loadModels();
};
$('#dDel').onclick = e => {
  e.preventDefault(); if (editing < 0) return;
  manual.splice(editing, 1); store.set('qi.servers', manual); $('#dlg').close(); loadModels();
};

render(); fillServers(); loadModels();
setInterval(() => { if (!busy && document.visibilityState === 'visible') loadModels(); }, 30000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
